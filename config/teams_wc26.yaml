# Pesos y calibración re-tuneados (16-jul) con el fold WC26 jugado (121
# partidos) sumado al backtest rolling 2019-2025. La combinación
# (elo 0.20, draw_tilt +0.2, T 0.90) mejora AMBOS dominios vs la anterior:
# pool 0.8385<0.8392 y WC26 0.8273<0.8338 de log-loss. El ML sigue en 0.
ensemble_weights:
  elo: 0.2
  poisson: 0.8
  ml: 0.0
elo_confederation_beta: 0.5
knockout_temperature: 1.2
host_advantage_tilt: 0.25
ml_device: auto
# Hiperparámetros del Poisson (grid con validación temporal; meseta 1100-1500)
poisson_half_life_days: 1500
poisson_alpha: 0.0003
ensemble_temperature: 0.90
# Calibración del empate: el modelo sub-predice empates (21.9% reales en el
# backtest). pd *= e^0.2 renormalizado; la temperatura sola no puede corregirlo.
ensemble_draw_tilt: 0.2
# Boost del torneo en curso: evaluado en knockouts de WCs 2002-2022 y EMPEORA
# (x1 0.962 -> x8 1.112 de log-loss). Se deja desactivado a propósito.
current_tournament_boost: 1.0
